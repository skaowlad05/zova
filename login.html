<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ZOVA - Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #111827, #2563eb);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      background: white;
      border-radius: 22px;
      padding: 28px;
      box-shadow: 0 15px 50px rgba(0,0,0,0.3);
    }

    .logo {
      text-align: center;
      font-size: 42px;
      font-weight: 900;
      color: #2563eb;
      margin-bottom: 5px;
      letter-spacing: 2px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    .tabs {
      display: flex;
      background: #f1f5f9;
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 22px;
    }

    .tab {
      width: 50%;
      padding: 12px;
      border: none;
      background: transparent;
      border-radius: 9px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .tab.active {
      background: white;
      color: #2563eb;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .form {
      display: none;
    }

    .form.active {
      display: block;
    }

    label {
      display: block;
      margin: 13px 0 7px;
      font-weight: bold;
      color: #333;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 11px;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
    }

    .main-btn {
      width: 100%;
      border: none;
      background: #2563eb;
      color: white;
      padding: 15px;
      border-radius: 12px;
      font-size: 17px;
      font-weight: bold;
      margin-top: 22px;
      cursor: pointer;
    }

    .main-btn:hover {
      background: #1d4ed8;
    }

    .forgot {
      display: block;
      text-align: center;
      margin-top: 15px;
      color: #2563eb;
      cursor: pointer;
      font-size: 14px;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      font-size: 14px;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .terms {
      text-align: center;
      font-size: 12px;
      color: #777;
      margin-top: 22px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">ZOVA</div>

    <div class="subtitle">
      Connect • Create • Share
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" onclick="showLogin()">
        Login
      </button>

      <button class="tab" onclick="showSignup()">
        Sign Up
      </button>
    </div>


    <!-- LOGIN FORM -->
    <div id="loginForm" class="form active">

      <label>Email / Username</label>
      <input
        type="text"
        id="loginUser"
        placeholder="Email বা Username"
      >

      <label>Password</label>
      <input
        type="password"
        id="loginPassword"
        placeholder="Password"
      >

      <button class="main-btn" onclick="loginUser()">
        Login
      </button>

      <span class="forgot" onclick="forgotPassword()">
        Forgot Password?
      </span>

      <div id="loginMessage" class="message"></div>

    </div>


    <!-- SIGN UP FORM -->
    <div id="signupForm" class="form">

      <label>Full Name</label>
      <input
        type="text"
        id="fullName"
        placeholder="আপনার নাম"
      >

      <label>Username</label>
      <input
        type="text"
        id="username"
        placeholder="Username"
      >

      <label>Email</label>
      <input
        type="email"
        id="email"
        placeholder="Email"
      >

      <label>Password</label>
      <input
        type="password"
        id="password"
        placeholder="কমপক্ষে ৮ অক্ষর"
      >

      <label>Confirm Password</label>
      <input
        type="password"
        id="confirmPassword"
        placeholder="Password আবার লিখুন"
      >

      <button class="main-btn" onclick="createAccount()">
        Create Account
      </button>

      <div id="signupMessage" class="message"></div>

    </div>


    <div class="terms">
      By using ZOVA, you agree to ZOVA's Terms,
      Community Guidelines and Privacy Policy.
    </div>

  </div>


  <script>

    /* LOGIN TAB */

    function showLogin() {

      document.getElementById("loginForm")
        .classList.add("active");

      document.getElementById("signupForm")
        .classList.remove("active");

      document.querySelectorAll(".tab")[0]
        .classList.add("active");

      document.querySelectorAll(".tab")[1]
        .classList.remove("active");
    }


    /* SIGN UP TAB */

    function showSignup() {

      document.getElementById("signupForm")
        .classList.add("active");

      document.getElementById("loginForm")
        .classList.remove("active");

      document.querySelectorAll(".tab")[1]
        .classList.add("active");

      document.querySelectorAll(".tab")[0]
        .classList.remove("active");
    }


    /* LOGIN */

    function loginUser() {

      const user =
        document.getElementById("loginUser").value.trim();

      const password =
        document.getElementById("loginPassword").value;

      const message =
        document.getElementById("loginMessage");


      if (user === "" || password === "") {

        message.innerText =
          "Please enter your Email/Username and Password.";

        message.className =
          "message error";

        message.style.display = "block";

        return;
      }


      if (password.length < 8) {

        message.innerText =
          "Password must be at least 8 characters.";

        message.className =
          "message error";

        message.style.display = "block";

        return;
      }


      /*
        LOGIN SUCCESS

        এখানে Login সফল হলে
        ZOVA Home Page খুলবে।
      */

      message.innerText =
        "Login successful! Opening ZOVA...";

      message.className =
        "message success";

      message.style.display = "block";


      setTimeout(function() {

        window.location.href = "index.html";

      }, 800);

    }


    /* CREATE ACCOUNT */

    function createAccount() {

      const name =
        document.getElementById("fullName").value.trim();

      const username =
        document.getElementById("username").value.trim();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      const confirmPassword =
        document.getElementById("confirmPassword").value;

      const message =
        document.getElementById("signupMessage");


      if (
        name === "" ||
        username === "" ||
        email === "" ||
        password === "" ||
        confirmPassword === ""
      ) {

        message.innerText =
          "সবগুলো ঘর পূরণ করুন।";

        message.className =
          "message error";

        message.style.display = "block";

        return;
      }


      if (password.length < 8) {

        message.innerText =
          "Password কমপক্ষে ৮ অক্ষরের হতে হবে।";

        message.className =
          "message error";

        message.style.display = "block";

        return;
      }


      if (password !== confirmPassword) {

        message.innerText =
          "দুইটি Password একই নয়।";

        message.className =
          "message error";

        message.style.display = "block";

        return;
      }


      /*
        SIGN UP SUCCESS

        বর্তমানে এটি Demo system।
        Backend/database যুক্ত হলে
        এখানে সত্যিকারের account তৈরি হবে।
      */

      message.innerText =
        "Account created! Opening ZOVA...";

      message.className =
        "message success";

      message.style.display = "block";


      setTimeout(function() {

        window.location.href = "index.html";

      }, 800);

    }


    /* FORGOT PASSWORD */

    function forgotPassword() {

      alert(
        "Forgot Password system will be connected with the ZOVA backend later."
      );

    }

  </script>

</body>
</html>
